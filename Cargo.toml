[package]
name = "nori-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
color-eyre = "0.6.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tui-textarea = "0.7"
async-trait = "0.1"
async-stream = "0.3"
which = "7.0"
opener = "0.7"
