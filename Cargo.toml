[workspace]
members = ["tui-components"]

[package]
name = "nori-cli"
version = "0.1.0"
edition = "2024"
default-run = "tui"

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
color-eyre = "0.6.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
async-stream = "0.3"
which = "7.0"
opener = "0.7"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
tui-components = { path = "./tui-components" }
 agent-client-protocol = "0.7.0"
 tuicore = { git = "https://github.com/CSRessel/terminal-input-debug", rev = "a2f66fd" }
tracing = "0.1.41"
 # dev deps: insta tempfile tokio-test tracing tracing-subscriber tracing-appender

[dev-dependencies]
tempfile = "3"
once_cell = "1"
insta = "1.43"
