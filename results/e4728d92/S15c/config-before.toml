[[agents]]
name = "Lantern Claude"
slug = "claude-code"
[agents.distribution.local]
command = "/usr/bin/python3"
args = ["-I", "/tmp/nori-host-tui-acceptance-l1/bin/lantern_adapter.py"]
[agents.distribution.local.env]
LANTERN_NAME = "claude-code"
LANTERN_LEDGER = "/tmp/nori-host-tui-acceptance-l1/S15c/ledger.jsonl"
LANTERN_MODES = "auto,default,acceptEdits,plan"
