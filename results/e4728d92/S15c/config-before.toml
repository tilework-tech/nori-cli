agent = "opencode"
approval_policy = "on-request"
sandbox_mode = "read-only"
[projects."/tmp/nori-host-tui-acceptance-l1/S15c/roots/alpha/app"]
trust_level = "trusted"
[projects."/tmp/nori-host-tui-acceptance-l1/S15c/roots/beta/app"]
trust_level = "trusted"
[projects."/tmp/nori-host-tui-acceptance-l1/S15c/roots/laptop/app"]
