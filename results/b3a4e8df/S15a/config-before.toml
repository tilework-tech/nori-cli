[[agents]]
name = "Lantern Claude"
slug = "claude-code"
[agents.distribution.local]
command = "/usr/bin/python3"
args = ["-I", "/tmp/nori-host-tui-acceptance-M2/bin/lantern_adapter.py"]
[agents.distribution.local.env]
LANTERN_NAME = "claude-code"
LANTERN_LEDGER = "/tmp/nori-host-tui-acceptance-M2/S15a/ledger.jsonl"
LANTERN_MODES = "auto,default,acceptEdits,plan"
LANTERN_SAVED = "/tmp/nori-host-tui-acceptance-M2/S15a/saved-sessions.json"
LANTERN_CONTROL = "/tmp/nori-host-tui-acceptance-M2/S15a/control"

