agent = "claude-code"
approval_policy = "never"
sandbox_mode = "danger-full-access"
[projects."/tmp/nori-host-tui-acceptance-M2/S15a/roots/alpha/app"]
trust_level = "trusted"
[projects."/tmp/nori-host-tui-acceptance-M2/S15a/roots/beta/app"]
trust_level = "trusted"
[projects."/tmp/nori-host-tui-acceptance-M2/S15a/roots/laptop/app"]
