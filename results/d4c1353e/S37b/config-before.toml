agent = "claude-code"
sandbox_mode = "workspace-write"
[sandbox_workspace_write]
network_access = true
[projects."/tmp/nori-host-tui-acceptance-ap/S37b/roots/alpha/app"]
trust_level = "trusted"
[projects."/tmp/nori-host-tui-acceptance-ap/S37b/roots/beta/app"]
trust_level = "trusted"
[projects."/tmp/nori-host-tui-acceptance-ap/S37b/roots/laptop/app"]
trust_level = "trusted"
[host]
default_mode = "ask"

[[agents]]
name = "Lantern Claude"
slug = "claude-code"
[agents.distribution.local]
command = "/usr/bin/python3"
args = ["-I", "/tmp/nori-host-tui-acceptance-ap/bin/lantern_adapter.py"]
[agents.distribution.local.env]
LANTERN_NAME = "claude-code"
LANTERN_LEDGER = "/tmp/nori-host-tui-acceptance-ap/S37b/ledger.jsonl"
LANTERN_MODES = "auto,default,acceptEdits,plan"
LANTERN_SAVED = "/tmp/nori-host-tui-acceptance-ap/S37b/saved-sessions.json"
LANTERN_CONTROL = "/tmp/nori-host-tui-acceptance-ap/S37b/control"

