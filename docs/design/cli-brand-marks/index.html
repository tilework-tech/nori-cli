<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nori CLI face: study 02</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Fonts are optional. Cells are fixed-width boxes, so the grid holds with any fallback. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@500&text=%E3%80%88%E3%80%89&display=swap" rel="stylesheet">
<style>
  :root{--base:#161616;--deep:#0e0e0e;--overlay:#262626;--muted:#525252;--fg:#dde1e6;--hi:#f2f4f8;--dim:#8a8f98;--green:#42be65;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --wide:'IBM Plex Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Yu Gothic','MS Gothic',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--deep);color:var(--fg);font-family:var(--mono);font-size:13px}
  body{padding:20px}
  h1{font-size:15px;font-weight:600;margin:0 0 4px} p.sub{margin:0 0 14px;color:var(--dim)}
  #shot{display:inline-block;background:var(--deep);padding:16px}
  h2{font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  .grp{margin:0 0 22px} .grp:last-child{margin:0}
  .opt{display:flex;align-items:center;gap:18px;margin:0 0 8px}
  .id{width:150px;flex:none} .id b{color:var(--green);font-weight:600;margin-right:8px} .id span{color:var(--fg)}
  .note{color:var(--dim);font-size:12px;max-width:330px}
  .term{background:var(--base);border:1px solid var(--overlay);padding:.3em 1ch;line-height:1.5;white-space:pre;flex:none}
  .strip{display:flex;gap:10px;flex-wrap:wrap} .strip .term{position:relative;margin-bottom:14px}
  .strip .ms{position:absolute;left:0;bottom:-16px;font-size:10px;color:var(--muted)}
  .c{display:inline-block;width:1ch;height:1.5em;vertical-align:top;white-space:pre}
  .c.w2{width:2ch}
  .c.w2 i{font-style:normal;font-family:var(--wide);font-weight:500;font-size:1.2em;line-height:1.25;display:inline-block;width:1.6667ch;text-align:center}
  .g{color:var(--green)} .b{font-weight:600;color:var(--hi)} .d{color:var(--dim)}
  #bar{margin:0 0 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  select,button{font:inherit;color:inherit;background:var(--overlay);border:1px solid var(--muted);padding:3px 8px}
  .bare #bar,.bare h1,.bare p.sub{display:none} body.bare{padding:0}
</style>
</head>
<body>
<h1>Nori CLI face · study 02</h1>
<p class="sub">Face <b>〉_ ▐</b> and wordmark <b>〉nori CLI</b>. Eyes green, mouth foreground. Design study, synthetic content. Every frame keeps its cells.</p>
<div id="bar">
  <label>Speed <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.2">0.2×</option></select></label>
  <label>Size <select id="size"><option>34</option><option>22</option><option>14</option></select> px</label>
  <label>View <select id="view"><option value="live">Live</option><option value="sheet">All frames</option></select></label>
  <button id="pause">Pause</button>
</div>
<div id="shot"></div>
<script>
const WIDE = new Set(['〉','〈']);
const Q = new URLSearchParams(location.search);
if (Q.get('bare') === '1') document.body.classList.add('bare');
const S = {size:+(Q.get('size')||34), view:Q.get('view')||'live', group:Q.get('group'), speed:1, paused:Q.has('t')};

/* A frame is a compact string: lowercase tags switch style for what follows.
   {g} green  {f} foreground  {b} bold  {d} dim */
function parse(str) {
  const out = []; let cls = 'f';
  str.replace(/\{(\w)\}|([\s\S])/gu, (m, tag, ch) => { if (tag) cls = tag; else out.push([ch, cls]); });
  return out;
}
const REST = '{g}〉{f}_ {g}▐';
const WORD = '{g}〉{b}nori CLI {d}v0.42.0';
const fr = (s, ms) => ({s, ms});

function typing(build) {            // build(i, typedText) -> frame string
  const text = 'nori CLI', out = [];
  for (let i = 1; i <= text.length; i++) out.push(fr(build(i, text.slice(0, i)), 60));
  return out;
}

const GROUPS = [
 {key:'blink', title:'Blink · both eyes · 40 to 80 ms frames', rest:REST, opts:[
  {id:'B1', name:'Dash', note:'One frame. Eyes become dashes.', f:[fr(REST,900), fr('{g}- {f}_ {g}-',80)]},
  {id:'B2', name:'Dot', note:'One frame. Eyes shrink to dots.', f:[fr(REST,900), fr('{g}· {f}_ {g}·',80)]},
  {id:'B3', name:'Squash', note:'Three frames. Eyes get smaller, close, reopen.', f:[fr(REST,900), fr('{g}› {f}_ {g}▗',40), fr('{g}- {f}_ {g}▁',40), fr('{g}› {f}_ {g}▗',40)]},
  {id:'B4', name:'Flat', note:'One frame. Eyes drop to the mouth line.', f:[fr(REST,900), fr('{g}_ {f}_ {g}_',80)]},
 ]},
 {key:'wink', title:'Wink · right eye only', rest:REST, opts:[
  {id:'W1', name:'Dash', note:'Block becomes a dash, holds 240 ms.', f:[fr(REST,900), fr('{g}〉{f}_ {g}-',240)]},
  {id:'W2', name:'Squash', note:'Block shrinks to a low bar, holds, reopens.', f:[fr(REST,900), fr('{g}〉{f}_ {g}▗',40), fr('{g}〉{f}_ {g}▁',240), fr('{g}〉{f}_ {g}▗',40)]},
  {id:'W3', name:'Underscore', note:'Eye joins the mouth line.', f:[fr(REST,900), fr('{g}〉{f}_ {g}_',240)]},
 ]},
 {key:'look', title:'Look · left, centre, right', rest:' '+REST+' ', opts:[
  {id:'L1', name:'Glyph swap', note:'Left: ▐ to ▌. Right: 〉 to 〈. Nothing shifts; the bracket flips.',
    f:[fr(' '+REST+' ',700), fr(' {g}〉{f}_ {g}▌ ',500), fr(' '+REST+' ',300), fr(' {g}〈{f}_ {g}▐ ',500)]},
  {id:'L2', name:'One-cell shift', note:'The whole face moves one cell.',
    f:[fr(' '+REST+' ',700), fr(REST+'  ',500), fr(' '+REST+' ',300), fr('  '+REST,500)]},
  {id:'L3', name:'Eyes only', note:'Left: ▐ to ▌. Right: the chevron steps one cell as a narrow >.',
    f:[fr(' '+REST+' ',700), fr(' {g}〉{f}_ {g}▌ ',500), fr(' '+REST+' ',300), fr(' {g} >{f}_ {g}▐ ',500)]},
 ]},
 {key:'retype', title:'Retype · face into wordmark · 60 ms per letter', rest:WORD, opts:[
  {id:'R1', name:'Mouth types', note:'The underscore is the cursor. It pushes the right eye along.',
    f:[fr(REST,700), ...typing((i,t)=>`{g}〉{b}${t}{f}_ {g}▐`), fr('{g}〉{b}nori CLI{f}_ {g}▐',240), fr('{g}〉{b}nori CLI',120), fr(WORD,1600)]},
  {id:'R2', name:'Eye types', note:'The mouth goes. The right eye is the block cursor.',
    f:[fr(REST,700), fr('{g}〉▐',120), ...typing((i,t)=>`{g}〉{b}${t}{g}▐`), fr('{g}〉{b}nori CLI{g}▐',240), fr('{g}〉{b}nori CLI',120), fr(WORD,1600)]},
  {id:'R3', name:'Overwrite', note:'Letters replace the face in place. No cursor.',
    f:[fr(REST,700), fr('{g}〉{b}n{f} {g}▐',60), fr('{g}〉{b}no{g}▐',60), fr('{g}〉{b}nor',60), fr('{g}〉{b}nori',60), fr('{g}〉{b}nori C',60), fr('{g}〉{b}nori CL',60), fr('{g}〉{b}nori CLI',240), fr(WORD,1600)]},
 ]},
];
// Pad every option in a group to the same loop length, ending on the rest frame.
for (const g of GROUPS) {
  for (const o of g.opts) o.len = o.f.reduce((a, x) => a + x.ms, 0);
  g.len = Math.max(...g.opts.map(o => o.len)) + 500;
  g.cols = Math.max(...g.opts.flatMap(o => o.f.map(x => width(parse(x.s)))), width(parse(g.rest)));
}
function width(cells) { return cells.reduce((a, [ch]) => a + (WIDE.has(ch) ? 2 : 1), 0); }
const esc = c => c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c;
function cellsHTML(str, cols) {
  let h = '', used = 0;
  for (const [ch, cls] of parse(str)) {
    const w = WIDE.has(ch) ? 2 : 1; used += w;
    h += w === 2 ? `<span class="c w2 ${cls}"><i>${ch}</i></span>` : `<span class="c ${cls}">${esc(ch)}</span>`;
  }
  for (; used < cols; used++) h += '<span class="c"> </span>';
  return h;
}
const term = (str, cols, size, extra) => `<div class="term" style="font-size:${size}px">${cellsHTML(str, cols)}${extra || ''}</div>`;
function at(o, g, t) {
  t = t % g.len;
  for (const x of o.f) { if (t < x.ms) return x.s; t -= x.ms; }
  return g.rest;
}
let T = Q.has('t') ? +Q.get('t') : 0;
function draw() {
  let h = '';
  for (const g of GROUPS) {
    if (S.group && S.group !== g.key) continue;
    h += `<div class="grp"><h2>${g.title}</h2>`;
    for (const o of g.opts) {
      if (S.view === 'sheet') {
        const uniq = o.f.filter((x, i) => i === 0 || x.s !== o.f[i - 1].s);
        h += `<div class="opt"><div class="id"><b>${o.id}</b><span>${o.name}</span></div><div class="strip">` +
          uniq.map(x => term(x.s, 0, Math.min(S.size, 20), `<span class="ms">${x.ms} ms</span>`)).join('') + `</div></div>`;
      } else {
        h += `<div class="opt"><div class="id"><b>${o.id}</b><span>${o.name}</span></div>${term(at(o, g, T), g.cols, S.size)}<div class="note">${o.note}</div></div>`;
      }
    }
    h += '</div>';
  }
  document.getElementById('shot').innerHTML = h;
}
window.setT = t => { T = t; S.paused = true; draw(); };
window.groupLen = k => GROUPS.find(g => g.key === k).len;
let last = performance.now();
function loop(now) { if (!S.paused) { T += (now - last) * S.speed; if (S.view === 'live') draw(); } last = now; requestAnimationFrame(loop); }
const $ = id => document.getElementById(id);
$('speed').onchange = e => S.speed = +e.target.value;
$('size').value = S.size; $('size').onchange = e => { S.size = +e.target.value; draw(); };
$('view').value = S.view; $('view').onchange = e => { S.view = e.target.value; draw(); };
$('pause').onclick = () => { S.paused = !S.paused; $('pause').textContent = S.paused ? 'Play' : 'Pause'; };
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { draw(); document.title = 'ready'; requestAnimationFrame(loop); });
</script>
</body>
</html>
