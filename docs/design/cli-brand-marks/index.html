<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nori CLI brand marks: study 01</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Fonts are optional. Cells are fixed-width boxes, so the grid holds with any fallback. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&text=%E3%80%89&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#161616; --deep:#0e0e0e; --overlay:#262626; --muted:#525252;
    --fg:#dde1e6; --hi:#f2f4f8; --dim:#8a8f98; --green:#42be65;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --wide:'IBM Plex Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Yu Gothic','MS Gothic',sans-serif;
    --fs:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--deep);color:var(--fg);font-family:var(--mono);font-size:13px}
  body{padding:20px}
  h1{font-size:15px;font-weight:600;margin:0 0 4px}
  p.sub{margin:0 0 16px;color:var(--dim)}
  #shot{display:inline-block;background:var(--deep);padding:14px}
  .label{color:var(--dim);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px}
  .label b{color:var(--fg);font-weight:500}
  .term{background:var(--base);border:1px solid var(--overlay);padding:10px 0;margin:0 0 14px;
        font-family:var(--mono);font-size:var(--fs);line-height:1.45;white-space:pre}
  .term:last-child{margin-bottom:0}
  .r{display:block;height:1.45em;overflow:hidden}
  /* One terminal cell. Wide glyphs take exactly two. */
  .c{display:inline-block;width:1ch;height:1.45em;vertical-align:top;overflow:visible;white-space:pre}
  .c.w2{width:2ch}
  .c.w2 i{font-style:normal;font-family:var(--wide);font-size:1.2em;line-height:1;display:inline-block;width:1.6667ch;text-align:left}
  .g{color:var(--green)} .b{font-weight:600;color:var(--hi)} .d{color:var(--dim)}
  .cur{background:var(--fg);color:var(--base)}
  .grid .c{outline:1px solid rgba(255,255,255,.07);outline-offset:-1px}
  .ms{color:var(--muted)}
  .frames .term{padding:8px 0}
  /* controls */
  #panel{margin-top:18px;max-width:900px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px}
  fieldset{border:1px solid var(--overlay);padding:8px 10px;margin:0;min-width:0}
  legend{color:var(--dim);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:0 4px}
  label{display:block;cursor:pointer;padding:1px 0}
  input,button,select{font:inherit;color:inherit;accent-color:var(--green)}
  button{background:var(--overlay);border:1px solid var(--muted);padding:3px 10px;cursor:pointer}
  button:hover{border-color:var(--fg)}
  #plain{margin-top:14px;max-width:900px;background:var(--base);border:1px solid var(--overlay);padding:10px;white-space:pre;overflow:auto;color:var(--fg)}
  .bare #panel,.bare #plain,.bare h1,.bare p.sub{display:none}
  .bare body,body.bare{padding:0}
</style>
</head>
<body>
<h1>Nori CLI brand marks · study 01</h1>
<p class="sub">Design study only. Synthetic content. Every glyph sits in a fixed cell, so nothing shifts between frames.</p>

<div id="shot"></div>

<div id="panel">
  <fieldset><legend>Hello line</legend>
    <label><input type="radio" name="mode" value="still" checked> Still (static alternative)</label>
    <label><input type="radio" name="mode" value="blinkA"> Blink A: cursor</label>
    <label><input type="radio" name="mode" value="blinkB"> Blink B: stars</label>
    <label><input type="radio" name="mode" value="retype"> Retyped greeting</label>
  </fieldset>
  <fieldset><legend>Playback</legend>
    <button id="play">Pause</button> <button id="step">Step</button>
    <label style="margin-top:6px">Speed
      <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label>
    <label><input type="checkbox" id="loop" checked> Loop (the product would play once)</label>
    <div class="ms" id="clock"></div>
  </fieldset>
  <fieldset><legend>Glyphs</legend>
    <label><input type="radio" name="glyph" value="uni" checked> 〉 U+3009 and ▐ U+2590</label>
    <label><input type="radio" name="glyph" value="ascii"> Fallback: &gt; and |</label>
    <label style="margin-top:6px"><input type="checkbox" id="space"> Add a space after the prompt 〉</label>
    <label><input type="checkbox" id="grid"> Show cell grid</label>
  </fieldset>
  <fieldset><legend>Terminal</legend>
    <label>Columns
      <select id="cols"><option>80</option><option>60</option><option>40</option><option>24</option></select></label>
    <label>Cell size
      <select id="fs"><option value="14">14 px</option><option value="12">12 px</option><option value="16">16 px</option></select></label>
  </fieldset>
</div>
<pre id="plain"></pre>

<script>
/* ---------- model ---------- */
const TICK = 80;                         // ms. One typed character per tick.
const HALF = 7;                          // ticks. 560 ms on, 560 ms off: the Nori 1.1 s cursor blink.
const Q = new URLSearchParams(location.search);
const S = {
  mode: Q.get('mode') || 'still',
  glyph: Q.get('glyph') || 'uni',
  space: Q.get('space') === '1',
  grid: Q.get('grid') === '1',
  cols: +(Q.get('cols') || 80),
  fs: +(Q.get('fs') || 14),
  view: Q.get('view') || 'surfaces',     // surfaces | frames | face
  frame: Q.has('frame') ? +Q.get('frame') : null,
  speed: 1, loop: true, playing: !Q.has('frame') && !Q.has('tick'),
};
if (Q.get('bare') === '1') document.body.classList.add('bare');

const VERSION = 'v0.42.0';
const SID = '019b2f4a-7c1e-7d3b-a5f0-3e9c8b1d6a42';   // synthetic

/* A frame of the hello line: cursor on/off, star glyph, typed letters, version shown. */
const FULL = {cursor:true, star:'*', typed:5, ver:true};
const f = (o, ticks) => ({s:Object.assign({}, FULL, o), ticks});
const SEQ = {
  still:  [f({}, 40)],
  blinkA: [f({},14), f({cursor:false},HALF), f({},HALF), f({cursor:false},HALF), f({},45)],
  blinkB: [f({},14), f({star:'-'},2), f({},3), f({star:'-'},2), f({},59)],
  retype: [f({typed:0,ver:false},3), f({typed:1,ver:false},1), f({typed:2,ver:false},1), f({typed:3,ver:false},1),
           f({typed:4,ver:false},1), f({typed:5,ver:false},3), f({},6),
           f({cursor:false},HALF), f({},HALF), f({cursor:false},HALF), f({},43)],
};

/* ---------- glyph helpers ---------- */
const P = () => S.glyph === 'uni' ? '〉' : '> ';          // always two cells
const CUR = () => S.glyph === 'uni' ? '▐' : '|';
const seg = (t, cls) => ({t, cls: cls || ''});

function face(s) {
  return [seg(s.star,'d'), seg(P(),'g'), seg('_'), seg(s.star,'d'), seg(' '), seg(s.cursor ? CUR() : ' ')];
}
function wordmark(word, n) {
  return [seg('nori','b'), seg(P(),'g'), seg(word.slice(0, n)), seg(' '.repeat(word.length - n))];
}
function helloLine(s) {
  const out = [seg('  '), ...face(s)];
  if (S.cols >= 34) out.push(seg('      '), ...wordmark('hello', s.typed));
  else if (S.cols >= 22) out.push(seg('  '), ...wordmark('hello', s.typed));
  if (S.cols >= 44) out.push(seg('  '), seg(s.ver ? VERSION : ' '.repeat(VERSION.length), 'd'));
  return out;
}
function byeLine() {
  const out = [seg('  '), ...face(FULL)];
  if (S.cols >= 34) out.push(seg('      '), ...wordmark('goodbye', 7));
  else if (S.cols >= 22) out.push(seg('  '), ...wordmark('goodbye', 7));
  return out;
}
const kv = (k, v, cls) => [seg('  '), seg(k.padEnd(13)), seg(v, cls)];
const promptSeg = () => S.glyph === 'uni' ? (S.space ? '〉 ' : '〉') : (S.space ? '>  ' : '> ');

function surfaces(s) {
  const hello = [
    helloLine(s), [],
    kv('System', '~/code/tide-table · Approvals: Agent'),
    kv('Agent', 'Claude · Opus 5 · xhigh · Plan'),
  ];
  const prompt = [
    [seg(promptSeg(),'g'), seg('which stations are missing a low-tide reading?','d')],
    [],
    [seg(promptSeg(),'g'), seg('plot them on the ch'), seg(' ','cur')],
  ];
  const bye = [
    byeLine(), [],
    kv('Session', SID),
    [seg(' '.repeat(15)), seg('Title  ','d'), seg('Chart the missing tide readings')],
    [seg(' '.repeat(15)), seg('Agent  ','d'), seg('Claude Code')],
    kv('Messages', '6 prompts · 9 replies'),
    kv('Tools', '14  Read'),
    [seg(' '.repeat(15)), seg(' 9  Bash')],
    [seg(' '.repeat(15)), seg(' 4  Edit')],
    [],
    kv('Context', '48,120 of 200,000 · 24% full'),
    kv('Tokens', '312,400  total'),
    kv('Cost', '$0.58 · reported by the agent'),
    [],
    [seg('nori resume ' + SID, 'g')],
  ];
  return [['hello', 'welcome card, first line', hello], ['prompt', 'history echo and composer', prompt], ['goodbye', 'exit card, first line', bye]];
}

/* ---------- render ---------- */
const WIDE = new Set(['〉']);
const esc = c => c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c;
function rowHTML(segs) {
  let h = '', used = 0;
  for (const {t, cls} of segs) for (const ch of t) {
    const w = WIDE.has(ch) ? 2 : 1;
    if (used + w > S.cols) break;
    used += w;
    h += w === 2 ? `<span class="c w2 ${cls}"><i>${ch}</i></span>` : `<span class="c ${cls}">${esc(ch)}</span>`;
  }
  return `<span class="r">${h || ' '}</span>`;
}
const rowText = segs => segs.map(x => x.t).join('').replace(/\s+$/, '');
function term(rows, cols) {
  return `<div class="term${S.grid ? ' grid' : ''}" style="width:calc(${cols || S.cols}ch + 2px);font-size:${S.fs}px">${rows.map(rowHTML).join('')}</div>`;
}

function frameAt(tick) {
  const seq = SEQ[S.mode]; let t = tick, i = 0;
  for (; i < seq.length; i++) { if (t < seq[i].ticks) break; t -= seq[i].ticks; }
  return {i: Math.min(i, seq.length - 1), s: seq[Math.min(i, seq.length - 1)].s};
}
const total = () => SEQ[S.mode].reduce((a, x) => a + x.ticks, 0);

let tick = Q.has('tick') ? +Q.get('tick') : 0;
window.setTick = t => { tick = t; S.playing = false; draw(); };
function draw() {
  const shot = document.getElementById('shot');
  if (S.view === 'frames') { shot.innerHTML = framesView(); return; }
  if (S.view === 'compare') { shot.innerHTML = compareView(); return; }
  const cur = S.frame !== null ? {i: S.frame, s: SEQ[S.mode][S.frame].s} : frameAt(tick);
  if (S.view === 'face') {
    shot.innerHTML = term([helloLine(cur.s)], Math.min(S.cols, 44));
  } else {
    shot.innerHTML = surfaces(cur.s).map(([name, note, rows]) =>
      `<div class="label"><b>${name}</b> · ${note}</div>` + term(rows)).join('');
  }
  document.getElementById('clock').textContent =
    `${S.mode} · frame ${cur.i + 1}/${SEQ[S.mode].length} · ${tick * TICK} ms of ${total() * TICK} ms`;
  document.getElementById('plain').textContent =
    surfaces(cur.s).map(([name, , rows]) => `# ${name}\n` + rows.map(rowText).join('\n')).join('\n\n');
}
function framesView() {
  const saved = S.mode; let h = '';
  for (const [mode, title] of [['blinkA','Blink A · cursor'], ['blinkB','Blink B · stars'], ['retype','Retyped greeting']]) {
    S.mode = mode; let at = 0;
    const rows = SEQ[mode].map((fr, i) => {
      const from = at * TICK; at += fr.ticks;
      const last = i === SEQ[mode].length - 1;
      const stamp = (String(from).padStart(5) + ' ms ').padEnd(10) + (last ? 'rest' : fr.ticks * TICK + ' ms').padStart(7).padEnd(9);
      return [seg(' ' + stamp, 'ms'), ...helloLine(fr.s)];
    });
    h += `<div class="label"><b>${title}</b> · start, hold, frame</div>` + term(rows, 60);
  }
  S.mode = saved; return `<div class="frames">${h}</div>`;
}

function compareView() {
  const saved = S.mode; let h = '';
  for (const [mode, title] of [['blinkA','A · cursor blink'], ['blinkB','B · star blink'], ['retype','Retyped greeting, then A']]) {
    S.mode = mode;
    h += `<div class="label"><b>${title}</b></div>` + term([helloLine(frameAt(tick).s)], 44);
  }
  S.mode = saved; return h;
}

/* ---------- loop and controls ---------- */
let last = performance.now(), acc = 0;
function loop(now) {
  if (S.playing && S.frame === null) {
    acc += (now - last) * S.speed;
    while (acc >= TICK) {
      acc -= TICK; tick++;
      if (tick >= total()) { if (S.loop) tick = 0; else { tick = total() - 1; S.playing = false; } }
    }
    draw();
  }
  last = now; requestAnimationFrame(loop);
}
const $ = id => document.getElementById(id);
document.querySelectorAll('input[name=mode]').forEach(r => { r.checked = r.value === S.mode; r.onchange = () => { S.mode = r.value; S.frame = null; tick = 0; S.playing = true; $('play').textContent = 'Pause'; draw(); }; });
document.querySelectorAll('input[name=glyph]').forEach(r => { r.checked = r.value === S.glyph; r.onchange = () => { S.glyph = r.value; draw(); }; });
$('space').checked = S.space; $('space').onchange = e => { S.space = e.target.checked; draw(); };
$('grid').checked = S.grid; $('grid').onchange = e => { S.grid = e.target.checked; draw(); };
$('cols').value = S.cols; $('cols').onchange = e => { S.cols = +e.target.value; draw(); };
$('fs').value = S.fs; $('fs').onchange = e => { S.fs = +e.target.value; draw(); };
$('speed').onchange = e => { S.speed = +e.target.value; };
$('loop').onchange = e => { S.loop = e.target.checked; };
$('play').onclick = () => { S.frame = null; S.playing = !S.playing; $('play').textContent = S.playing ? 'Pause' : 'Play'; };
$('step').onclick = () => { S.frame = null; S.playing = false; $('play').textContent = 'Play'; tick = (tick + 1) % total(); draw(); };
if (matchMedia('(prefers-reduced-motion: reduce)').matches && !Q.has('mode')) S.mode = 'still';
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { draw(); document.title = 'ready'; requestAnimationFrame(loop); });
draw();
</script>
</body>
</html>
