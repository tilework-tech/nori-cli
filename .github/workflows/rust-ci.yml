name: rust-ci
on:
  push:
    branches: ['verify/pr-793-f59783d9-native-acceptance']

jobs:
  checks:
    name: macOS independent acceptance for #793 at f59783d9
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 150
    defaults:
      run:
        working-directory: nori-rs
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f59783d9917d7b33cc5b46e692056827c8075277
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = f59783d9917d7b33cc5b46e692056827c8075277 && git diff --quiet HEAD -- . && git rev-parse HEAD HEAD:nori-rs && uname -sm && sw_vers
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: PR tests
        run: |
          mkdir -p target/mock-acp-out
          cargo +nightly build -p mock-acp-agent --profile ci-test --target ${{ matrix.target }} --artifact-dir target/mock-acp-out -Z unstable-options
          export MOCK_ACP_AGENT_BIN="$GITHUB_WORKSPACE/nori-rs/target/mock-acp-out/mock_acp_agent"
          cargo test --profile ci-test --target ${{ matrix.target }} -p nori-cli --test host_lifecycle history 2>&1 | tee "$RUNNER_TEMP/pr-tests.txt"
          grep -E "^test result:" "$RUNNER_TEMP/pr-tests.txt"
      - name: Optimized nori at f59783d9
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build --release --locked --bin nori --target ${{ matrix.target }}
          test "$(git rev-parse HEAD)" = f59783d9917d7b33cc5b46e692056827c8075277 && git diff --quiet HEAD -- .

      - name: Acceptance harness (independent verifier)
        uses: actions/checkout@v6
        with:
          ref: 7503ab4071d78ca8b260903480505595579d50df
          path: acc
          persist-credentials: false
      - name: Two-terminal acceptance on native macOS
        working-directory: acc
        run: |
          mkdir -p "$RUNNER_TEMP/mac"
          cp "$RUNNER_TEMP/pr-tests.txt" "$RUNNER_TEMP/mac/" || true
          brew install tmux >/dev/null
          tmux -V; python3 --version; uname -sm; sw_vers
          NORI_BIN="$GITHUB_WORKSPACE/nori-rs/target/${{ matrix.target }}/release/nori"
          shasum -a 256 "$NORI_BIN" > "$RUNNER_TEMP/mac/nori.sha256"
          python3 -I harness/run.py --nori "$NORI_BIN" --out "$RUNNER_TEMP/mac/scenarios" --only R06 | tee "$RUNNER_TEMP/mac/scenarios.log" || true
          python3 -I harness/feature_probes.py --nori "$NORI_BIN" --only history --out "$RUNNER_TEMP/mac/probes.json" | tee "$RUNNER_TEMP/mac/probes.log" || true
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pr-793-f59783d9
          path: ${{ runner.temp }}/mac
