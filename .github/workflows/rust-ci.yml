name: rust-ci
on:
  push:
    branches: ['verify/pr-791-fc7324c2-native-acceptance']

jobs:
  checks:
    name: macOS independent acceptance for #791 at fc7324c2
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 150
    defaults:
      run:
        working-directory: nori-rs
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fc7324c2301485c33ab2267c0a2383a64d5efb35
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = fc7324c2301485c33ab2267c0a2383a64d5efb35 && git diff --quiet HEAD -- . && git rev-parse HEAD HEAD:nori-rs && uname -sm && sw_vers
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: PR tests
        run: |
          mkdir -p target/mock-acp-out
          cargo +nightly build -p mock-acp-agent --profile ci-test --target ${{ matrix.target }} --artifact-dir target/mock-acp-out -Z unstable-options
          export MOCK_ACP_AGENT_BIN="$GITHUB_WORKSPACE/nori-rs/target/mock-acp-out/mock_acp_agent"
          cargo test --profile ci-test --target ${{ matrix.target }} -p nori-tui --lib 2>&1 | tee "$RUNNER_TEMP/pr-tests.txt"
          grep -E "^test result:" "$RUNNER_TEMP/pr-tests.txt"
      - name: Optimized nori at fc7324c2
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build --release --locked --bin nori --target ${{ matrix.target }}
          test "$(git rev-parse HEAD)" = fc7324c2301485c33ab2267c0a2383a64d5efb35 && git diff --quiet HEAD -- .

      - name: Optimized nori at dfd9b4d4 (comparison build)
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          git worktree add --detach "$RUNNER_TEMP/wt-dfd9b4d4" dfd9b4d4718773c953d297678b7ddfac54977d8a
          cd "$RUNNER_TEMP/wt-dfd9b4d4/nori-rs"
          test "$(git rev-parse HEAD)" = dfd9b4d4718773c953d297678b7ddfac54977d8a
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-dfd9b4d4" cargo build --release --locked --bin nori --target ${{ matrix.target }}
          mkdir -p "$RUNNER_TEMP/bin-dfd9b4d4" && cp "$RUNNER_TEMP/target-dfd9b4d4/${{ matrix.target }}/release/nori" "$RUNNER_TEMP/bin-dfd9b4d4/nori"

      - name: Optimized nori at 85da3524 (comparison build)
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          git worktree add --detach "$RUNNER_TEMP/wt-85da3524" 85da3524792f71f4861eabca8716c3f68a361b67
          cd "$RUNNER_TEMP/wt-85da3524/nori-rs"
          test "$(git rev-parse HEAD)" = 85da3524792f71f4861eabca8716c3f68a361b67
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-85da3524" cargo build --release --locked --bin nori --target ${{ matrix.target }}
          mkdir -p "$RUNNER_TEMP/bin-85da3524" && cp "$RUNNER_TEMP/target-85da3524/${{ matrix.target }}/release/nori" "$RUNNER_TEMP/bin-85da3524/nori"

      - name: Acceptance harness (independent verifier)
        uses: actions/checkout@v6
        with:
          ref: 7503ab4071d78ca8b260903480505595579d50df
          path: acc
          persist-credentials: false
      - name: Two-terminal acceptance on native macOS
        working-directory: acc
        run: |
          mkdir -p "$RUNNER_TEMP/mac"
          cp "$RUNNER_TEMP/pr-tests.txt" "$RUNNER_TEMP/mac/" || true
          brew install tmux >/dev/null
          tmux -V; python3 --version; uname -sm; sw_vers
          NORI_BIN="$GITHUB_WORKSPACE/nori-rs/target/${{ matrix.target }}/release/nori"
          shasum -a 256 "$NORI_BIN" > "$RUNNER_TEMP/mac/nori.sha256"
          python3 -I harness/run.py --nori "$NORI_BIN" --out "$RUNNER_TEMP/mac/scenarios" --only R01,R14a,S35r,S41c,S41h | tee "$RUNNER_TEMP/mac/scenarios.log" || true
          python3 -I harness/perf/joined_open.py --build old-main-dfd9b4d4 "$RUNNER_TEMP/bin-dfd9b4d4/nori" 0 --build main-85da3524 "$RUNNER_TEMP/bin-85da3524/nori" 1 --build pr-fc7324c2 "$NORI_BIN" 1 --sections 64 150 170 --samples 3 --out "$RUNNER_TEMP/mac/joined_open.json" | tee "$RUNNER_TEMP/mac/joined_open.log" || true
          python3 -I harness/run.py --nori "$RUNNER_TEMP/bin-85da3524/nori" --out "$RUNNER_TEMP/mac/main-control" --only R01,R14a,S35r,S41c,S41h | tee "$RUNNER_TEMP/mac/main-control.log" || true
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pr-791-fc7324c2
          path: ${{ runner.temp }}/mac
