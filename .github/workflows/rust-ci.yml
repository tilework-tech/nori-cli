name: rust-ci
on:
  push:
    branches: ['verify/pr-784-2b9f19f1-native-host']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: nori-rs
    env:
      CARGO_INCREMENTAL: "0"
      # Speed up repeated builds across CI runs by caching compiled objects.
      USE_SCCACHE: "true"
      SCCACHE_CACHE_SIZE: 10G

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            name: macOS attach cutover verification

    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2b9f19f1a1f54e95c68b0b42768f0992b91dd826
          persist-credentials: false

      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = 2b9f19f1a1f54e95c68b0b42768f0992b91dd826 && git diff --quiet HEAD -- . && git rev-parse HEAD && uname -sm && sw_vers

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # sudo apt-get update
          # sudo apt-get install -y coreutils musl-tools
          docker system prune -af || true

      - name: Setup faster linker
        uses: rui314/setup-mold@v1

      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Compute lockfile hash
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=${{ hashFiles('nori-rs/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=${{ hashFiles('nori-rs/rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"

      # Cache registry and git deps only. Do not cache ~/.cargo/bin because
      # restoring tool binaries after rust-toolchain setup can overwrite
      # rustup-managed cargo shims on hosted runners.
      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-

      # Install and configure sccache for faster builds
      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-
            sccache-${{ matrix.runner }}-${{ matrix.target }}-

      # CI checks
      - name: cargo fmt
        run: cargo +nightly fmt -- --check
      # - name: cargo check
      #   run: cargo check --profile ci-test --target ${{ matrix.target }}
      # - name: cargo clippy
      #   run: cargo clippy --target ${{ matrix.target }} --all-features -- -D warnings # needs all features to avoid unused import/var/etc errors
      - name: cargo build
        run: |
          mkdir -p target/mock-acp-out # build mock-acp-agent to a known location for E2E tests
          cargo +nightly build -p mock-acp-agent --profile ci-test --target ${{ matrix.target }} --artifact-dir target/mock-acp-out -Z unstable-options
          cargo build -p nori-cli -p nori-tui --bin nori --bin nori-tui --profile ci-test --target ${{ matrix.target }}
      - name: Unit tests for the joined terminal
        env:
          MOCK_ACP_AGENT_BIN: ${{ github.workspace }}/nori-rs/target/mock-acp-out/mock_acp_agent
        run: |
          cargo test --profile ci-test --target ${{ matrix.target }} -p nori-protocol
          cargo test --profile ci-test --target ${{ matrix.target }} -p nori-tui --lib
      - name: Diagnose the controller's answer on macOS
        env:
          MOCK_ACP_AGENT_BIN: ${{ github.workspace }}/nori-rs/target/mock-acp-out/mock_acp_agent
        run: |
          sed -i.bak '/^#!\[cfg(target_os = "linux")\]$/d' tui-pty-e2e/tests/host_attach.rs
          python3 - <<'PY'
          p = 'tui-pty-e2e/tests/host_attach.rs'
          s = open(p).read()
          old = """    controller.send_key(Key::Enter).unwrap();
              controller
                  .wait_for_text("Permission granted with option: allow", TIMEOUT)
                  .unwrap();"""
          new = """    eprintln!("DIAG before Enter:\\n{}", controller.screen_contents());
              controller.send_key(Key::Enter).unwrap();
              controller.settle(Duration::from_millis(1500));
              eprintln!("DIAG 1.5s after Enter:\\n{}", controller.screen_contents());
              controller.send_key(Key::Enter).unwrap();
              controller.settle(Duration::from_millis(1500));
              eprintln!("DIAG after second Enter:\\n{}", controller.screen_contents());
              controller
                  .wait_for_text("Permission granted with option: allow", TIMEOUT)
                  .unwrap();"""
          assert old in s, "pattern"
          open(p, 'w').write(s.replace(old, new))
          PY
          cargo test --profile ci-test --target ${{ matrix.target }} -p tui-pty-e2e --test host_attach watcher_cannot_answer -- --nocapture 2>&1 | grep -v '^\s*$' | sed -n '/DIAG before/,$p' | head -150 || true
          git checkout -- tui-pty-e2e/tests
      - name: Attach PTY suites on macOS, three rounds
        env:
          MOCK_ACP_AGENT_BIN: ${{ github.workspace }}/nori-rs/target/mock-acp-out/mock_acp_agent
        run: |
          sed -i.bak '/^#!\[cfg(target_os = "linux")\]$/d' tui-pty-e2e/tests/host_attach.rs
          sed -i.bak '/^#\[cfg(target_os = "linux")\]$/d' tui-pty-e2e/tests/explicit_host_close.rs
          ! grep -n 'cfg(target_os = "linux")' tui-pty-e2e/tests/host_attach.rs tui-pty-e2e/tests/explicit_host_close.rs
          for round in 1 2 3; do cargo test --profile ci-test --target ${{ matrix.target }} -p tui-pty-e2e --no-fail-fast --test host_attach --test host_approvals --test attached_external_cancel --test explicit_host_close > round-$round.log 2>&1 || true; grep -E "^test .* (ok|FAILED)$" round-$round.log | sed "s/^/round $round: /"; done | tee attach-rounds.txt
          for round in 1 2 3; do sed -n '/^failures:$/,/^test result/p' round-$round.log | head -400; done
          echo "attach rounds FAILED: $(grep -c FAILED attach-rounds.txt) of $(grep -c '^round' attach-rounds.txt)"
          ! grep -q FAILED attach-rounds.txt
          test "$(grep -c '^round' attach-rounds.txt)" -ge 132
      - name: Replay, PageUp, list latency and streaming on macOS
        working-directory: .
        run: |
          command -v tmux || brew install tmux
          python3 scripts/attach_perf/replay.py nori-rs/target/${{ matrix.target }}/ci-test/nori --turns 64 --sessions 1 --samples 5 --live --stream --output replay-macos.json
          python3 -c "import json; [print({k: s.get(k) for k in ('launch_to_list_ms','selection_to_content_ms','selection_to_latest_ms','page_up_ms','settled_key_ms','stream_key_ms','stream_total_ms')}) for s in json.load(open('replay-macos.json'))['samples']]"
      - name: Full PTY suite on macOS
        env:
          MOCK_ACP_AGENT_BIN: ${{ github.workspace }}/nori-rs/target/mock-acp-out/mock_acp_agent
        run: |
          git checkout -- tui-pty-e2e/tests
          cargo test --profile ci-test --target ${{ matrix.target }} -p tui-pty-e2e --no-fail-fast

      # Save cargo home cache (only when key wasn't hit)
      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      # Save sccache cache (fallback for when GHA backend isn't available)
      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        shell: bash
        run: |
          {
            echo "### sccache stats — ${{ matrix.target }}";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
