name: rust-ci
on:
  push:
    branches: ['verify/pr-751-5cb13fcd-native-drain']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: nori-rs
    env:
      CARGO_INCREMENTAL: "0"
      # Speed up repeated builds across CI runs by caching compiled objects.
      USE_SCCACHE: "true"
      SCCACHE_CACHE_SIZE: 10G

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            name: macOS exact head
            mode: exact

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select sources
        run: |
          if [ "${{ matrix.mode }}" = exact ]; then git fetch -q origin 5cb13fcd9f79caa15c7d56100f23f776ce3bf915 && git checkout 5cb13fcd9f79caa15c7d56100f23f776ce3bf915 -- nori-rs && git diff --cached --stat HEAD; fi
          git diff --stat 5cb13fcd9f79caa15c7d56100f23f776ce3bf915 -- nori-rs
          uname -sm

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # sudo apt-get update
          # sudo apt-get install -y coreutils musl-tools
          docker system prune -af || true

      - name: Setup faster linker
        uses: rui314/setup-mold@v1

      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Compute lockfile hash
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=${{ hashFiles('nori-rs/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=${{ hashFiles('nori-rs/rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"

      # Cache registry and git deps only. Do not cache ~/.cargo/bin because
      # restoring tool binaries after rust-toolchain setup can overwrite
      # rustup-managed cargo shims on hosted runners.
      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-

      # Install and configure sccache for faster builds
      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-
            sccache-${{ matrix.runner }}-${{ matrix.target }}-

      # CI checks
      # - name: cargo check
      #   run: cargo check --profile ci-test --target ${{ matrix.target }}
      # - name: cargo clippy
      #   run: cargo clippy --target ${{ matrix.target }} --all-features -- -D warnings # needs all features to avoid unused import/var/etc errors
      - name: cargo build
        run: |
          mkdir -p target/mock-acp-out # build mock-acp-agent to a known location for E2E tests
          cargo +nightly build -p mock-acp-agent --profile ci-test --target ${{ matrix.target }} --artifact-dir target/mock-acp-out -Z unstable-options
          cargo build -p nori-cli -p nori-tui --bin nori --bin nori-tui --profile ci-test --target ${{ matrix.target }}
      - name: Binary identity
        run: shasum -a 256 target/aarch64-apple-darwin/ci-test/nori target/aarch64-apple-darwin/ci-test/nori-tui | tee $GITHUB_WORKSPACE/bins-before.txt
      - name: Driver A-B on one build
        if: matrix.mode == 'ab'
        env:
          MOCK_ACP_AGENT_BIN: ${{ github.workspace }}/nori-rs/target/mock-acp-out/mock_acp_agent
        run: |
          out=$GITHUB_WORKSPACE/ab; mkdir -p $out
          cargo test --profile ci-test --target ${{ matrix.target }} -p tui-pty-e2e --no-run
          suites="--test host_startup --test host_new_session --test host_session_picker --test host_agent_switch"
          run() { d=$1; r=$2; mkdir -p $out/$d; env PTY_DRIVER=$d PTY_PROBE_DIR=$out/$d ${3:-PTY_NONE=1} cargo test --profile ci-test --target ${{ matrix.target }} -p tui-pty-e2e --no-fail-fast $suites 2>&1 | tee -a $out/$d/full.txt | grep -E "^test .* (ok|FAILED)$" | sed "s/^/$d round $r: /"; }
          for r in $(seq 1 12); do
            if [ $r -le 2 ]; then run sleep $r PTY_SAMPLE=1; else run sleep $r; fi
            run drain $r
            if [ $r -le 6 ]; then run human $r; fi
          done | tee $out/results.txt
          for d in sleep drain human; do echo "$d: $(grep -c "^$d .* ok$" $out/results.txt) ok, $(grep -c "^$d .*FAILED$" $out/results.txt) failed"; done | tee $out/summary.txt
          shasum -a 256 target/aarch64-apple-darwin/ci-test/nori target/aarch64-apple-darwin/ci-test/nori-tui | diff $GITHUB_WORKSPACE/bins-before.txt - && echo "binaries unchanged across drivers" | tee -a $out/summary.txt
      - name: Exact head full suites
        if: matrix.mode == 'exact'
        env:
          MOCK_ACP_AGENT_BIN: ${{ github.workspace }}/nori-rs/target/mock-acp-out/mock_acp_agent
        run: |
          out=$GITHUB_WORKSPACE/ab; mkdir -p $out
          for p in tui-pty-e2e nori-harness nori-host-runtime nori-acp-host nori-config nori-tui nori-cli nori-auth-providers; do
            cargo test --profile ci-test --target ${{ matrix.target }} --package $p --no-fail-fast 2>&1 | tee $out/full-$p.txt | grep -E "^test result:" | sed "s/^/$p: /"
          done | tee $out/suites.txt
          for r in $(seq 1 10); do cargo test --profile ci-test --target ${{ matrix.target }} -p tui-pty-e2e --no-fail-fast --test host_startup --test host_new_session --test host_session_picker --test host_agent_switch --test slash_menu_escape --test host_attach 2>&1 | grep -E "^test .* (ok|FAILED)$" | sed "s/^/round $r: /"; done | tee $out/repeat.txt
          echo "repeat: $(grep -c ' ok$' $out/repeat.txt) ok, $(grep -c FAILED $out/repeat.txt) failed" | tee -a $out/suites.txt
          ! grep -q FAILED $out/suites.txt $out/repeat.txt
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.mode }}
          path: ab/
          include-hidden-files: true
          retention-days: 14
      # Save cargo home cache (only when key wasn't hit)
      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      # Save sccache cache (fallback for when GHA backend isn't available)
      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        shell: bash
        run: |
          {
            echo "### sccache stats — ${{ matrix.target }}";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
