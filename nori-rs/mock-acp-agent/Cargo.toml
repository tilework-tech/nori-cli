[package]
name = "mock-acp-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scriptable mock Agent Client Protocol (ACP) agent for integration-testing ACP clients and harnesses"
keywords = ["acp", "agent", "testing", "mock"]
categories = ["development-tools::testing"]

[[bin]]
name = "mock_acp_agent"
path = "src/main.rs"

[features]
default = ["unstable"]
# Enable unstable ACP features (e.g. the model config-option category).
unstable = ["agent-client-protocol/unstable"]

[dependencies]
agent-client-protocol = { workspace = true }
futures = { workspace = true, features = ["std"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1.0"
env_logger = "0.11"
tungstenite = "0.26"
ureq = "3"
