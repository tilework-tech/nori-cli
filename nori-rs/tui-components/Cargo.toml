[package]
name = "nori-tui-components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable, domain-free Ratatui components for Nori applications"

[lib]
name = "nori_tui_components"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
nucleo-matcher = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
textwrap = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
crossterm = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
supports-color = { workspace = true }

[[test]]
name = "storybook_capture"
path = "examples/support/e2e_tests.rs"

[[test]]
name = "storybook_components"
path = "examples/component_storybook/e2e.rs"

[[test]]
name = "storybook_markdown"
path = "examples/markdown_storybook/e2e.rs"

[[test]]
name = "storybook_picker"
path = "examples/picker_storybook/e2e.rs"

[[test]]
name = "storybook_nori"
path = "examples/nori_storybook/e2e.rs"
