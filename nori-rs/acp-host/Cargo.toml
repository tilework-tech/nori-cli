[package]
edition = "2024"
name = "nori-acp-host"
version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Client-side hosting for Agent Client Protocol (ACP) agents: subprocess spawning, the wire connection, agent registry, and event translation"
keywords = ["acp", "agent", "ai", "cli"]
categories = ["development-tools"]

[lib]
doctest = false
name = "nori_acp_host"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
agent-client-protocol = { workspace = true, features = ["unstable"] }
anyhow = { workspace = true }
base64 = { workspace = true }
codex-rmcp-client = { workspace = true }
codex-utils-string = { workspace = true }
diffy = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
nori-config = { workspace = true }
nori-protocol = { workspace = true }
oauth2 = "5"
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true, features = ["log"] }
which = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
