[package]
name = "nori-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nori"
path = "src/main.rs"

[lib]
name = "nori_cli"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
futures = { workspace = true }
nori-harness = { workspace = true }
nori-installed = { workspace = true }
nori-config = { workspace = true }
codex-arg0 = { workspace = true }
codex-common = { workspace = true, features = ["cli"] }
codex-sandbox = { workspace = true }
codex-execpolicy = { workspace = true }
codex-process-hardening = { workspace = true }
codex-stdio-to-uds = { workspace = true }
nori-tui = { workspace = true }
nori-tui-components = { workspace = true }
nori-protocol = { workspace = true }
nori-providers = { workspace = true }
codex-keyring-store = { workspace = true }
ctor = { workspace = true }
crossterm = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
libc = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true}
serde_json = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
supports-color = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
codex_windows_sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs" }

[dev-dependencies]
agent-client-protocol = { workspace = true, features = ["unstable"] }
futures = { workspace = true }
ratatui = { workspace = true }
insta = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
